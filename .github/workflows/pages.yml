name: Pubblica Minuetto su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/music-challenge-website-c4ctfw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: sfida-musicale

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
