name: Pubblica Minuetto su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/music-challenge-website-c4ctfw
    paths:
      - "sfida-musicale/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pubblica sul branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sfida-musicale
          enable_jekyll: false
          commit_message: "Aggiorna il sito Minuetto"
